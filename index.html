<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>健康トラッカー</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --bg: #FFFFFF;
    --card: #FFFFFF;
    --ink: #191919;
    --sub: #9B9A97;
    --line: #E9E9E7;
    --hover: #F1F1EF;
    --active-bg: #191919;
    --active-fg: #FFFFFF;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; overflow-x: hidden; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    padding-bottom: 48px;
  }
  svg.icon{ width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; display:block; }

  header{
    position: sticky; top:0; z-index: 10;
    background: var(--bg);
    color: var(--ink);
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  header p{
    margin: 0; font-size: 13px; color: var(--ink); font-weight: 600;
  }
  main{ padding: 14px; max-width: 520px; margin: 0 auto; }
  section{ margin-bottom: 30px; }
  section > h2{
    font-size: 13px; font-weight: 600; color: var(--sub);
    margin: 0 0 10px 2px;
  }
  .card{
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    border: 1px solid var(--line);
  }

  /* counters (shared by today-input and edit panel) */
  .counter-grid{
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 5px;
    margin-bottom: 10px;
  }
  .counter-item{
    min-width: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 2px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    min-height: 88px;
    transition: background .15s ease, border-color .15s ease;
  }
  .counter-item.achieved,
  .numeric-card.achieved{
    background: #FBEEF1;
    border-color: #F3D2DB;
  }
  .counter-item .icon-wrap{ color: var(--ink); }
  .counter-item .icon-wrap svg.icon{ width: 18px; height: 18px; stroke-width: 1.7; }
  .counter-item .label{ font-size: 10.5px; color: var(--ink); font-weight: 500; white-space: nowrap; }
  .counter-item .count-row{ display: flex; align-items: center; gap: 4px; min-width: 0; }
  .counter-item .count{ font-size: 14.5px; font-weight: 600; color: var(--ink); min-width: 14px; text-align: center; }
  .counter-item .count.is-empty{ color: var(--sub); font-weight: 500; }
  .step-btn{
    appearance: none; border: none; cursor: pointer;
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    font-size: 13px; font-weight: 600; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: transform .08s ease, background .12s ease;
  }
  .step-btn:active{ transform: scale(.88); }
  .step-btn.plus{ background: var(--active-bg); color: var(--active-fg); }
  .step-btn.minus{ background: var(--hover); color: var(--ink); }
  .step-btn.minus:disabled{ opacity: .35; cursor: default; }

  .numeric-card{
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px;
    margin-bottom: 8px;
  }
  .numeric-card .icon-wrap{ width: 26px; display:flex; align-items:center; justify-content:center; color: var(--ink); }
  .numeric-card .field{ flex: 1; display:flex; flex-direction:column; }
  .numeric-card label{ font-size: 11.5px; color: var(--sub); font-weight: 500; margin-bottom: 2px; }
  .numeric-card input{
    font-size: 18px; font-weight: 600; color: var(--ink);
    border: none; outline: none; width: 100%; background: transparent;
    -moz-appearance: textfield;
    font-family: inherit;
  }
  .numeric-card input::placeholder{ color: var(--sub); font-weight: 400; }
  .numeric-card input::-webkit-outer-spin-button,
  .numeric-card input::-webkit-inner-spin-button{ -webkit-appearance: none; margin:0; }
  .numeric-card button{
    appearance: none; border: none; cursor: pointer;
    background: var(--active-bg); color: var(--active-fg);
    font-size: 12.5px; font-weight: 600;
    padding: 9px 15px; border-radius: 8px;
    white-space: nowrap;
  }
  .numeric-card button:active{ opacity: .8; }

  /* calendar */
  .calendar-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .calendar-nav button{
    appearance:none; border:1px solid var(--line); background:var(--card);
    border-radius:8px; width:32px; height:32px; font-size:13px; font-weight:600;
    color:var(--ink); cursor:pointer;
  }
  .calendar-nav button:active{ background:var(--hover); }
  #cal-label{ font-size:13px; font-weight:600; }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px; }
  .cal-weekday{ text-align:center; font-size:10px; color:var(--sub); font-weight:500; }
  .calendar-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:3px; }
  .cal-day{
    position:relative; aspect-ratio: 1/1; display:flex; align-items:center; justify-content:center;
    border-radius:8px; font-size:12px; font-weight:500; color:var(--ink);
    background:var(--card); border:1px solid transparent; cursor:pointer;
  }
  .cal-day.goal-1{ background:#FBEEF1; }
  .cal-day.goal-2{ background:#F8E2E7; }
  .cal-day.goal-3{ background:#F3D2DB; }
  .cal-day.goal-4{ background:#EEC0CD; }
  .cal-day.goal-5{ background:#E7ABBD; }
  .cal-day:not(.empty):hover{ background: var(--hover); }
  .cal-day.empty{ visibility:hidden; cursor:default; }
  .cal-day.today{ border-color: var(--ink); font-weight:700; }
  .cal-day.selected{ background: var(--active-bg) !important; color: var(--active-fg); border-color: var(--active-bg); }
  .cal-day .dot{
    position:absolute; bottom:3px; left:50%; transform:translateX(-50%);
    width:3px; height:3px; border-radius:50%; background: var(--ink);
  }
  .cal-day.selected .dot{ background: var(--active-fg); }
  .cal-day:active{ transform:scale(.92); }
  .cal-hint{ font-size:11px; color:var(--sub); margin:10px 2px 0; }

  #edit-panel .edit-panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  #edit-panel .edit-panel-head span{ font-size:13px; font-weight:600; }
  .edit-close-btn{
    appearance:none; border:1px solid var(--line); background:var(--card); color:var(--ink);
    font-weight:500; font-size:11.5px; padding:6px 12px; border-radius:8px; cursor:pointer;
  }
  .edit-close-btn:active{ background: var(--hover); }

  /* report */
  .metric-tabs{ display:flex; gap:4px; margin-bottom:10px; }
  .metric-tabs button{
    flex:1; min-width:0; appearance:none; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--sub);
    font-weight:500; font-size:10.5px; padding:7px 2px; border-radius:8px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .metric-tabs button.active{ background: var(--active-bg); color: var(--active-fg); border-color: var(--active-bg); }

  .range-tabs{ display:flex; gap:6px; margin-bottom: 12px; }
  .range-tabs button{
    flex:1; min-width: 0; appearance:none; cursor:pointer; border: 1px solid var(--line);
    background: var(--card); color: var(--sub); font-weight:500; font-size: 11.5px;
    padding: 7px 2px; border-radius: 8px;
  }
  .range-tabs button.active{ background: var(--active-bg); color: var(--active-fg); border-color: var(--active-bg); }

  .chart-card{ margin-bottom: 12px; padding: 14px 16px 10px; }
  .chart-card .chart-head{
    display:flex; align-items:baseline; justify-content: space-between; margin-bottom: 6px;
  }
  .chart-card .chart-title{ font-size: 13px; font-weight: 600; }
  .chart-card .chart-latest{ font-size: 11.5px; color: var(--sub); }
  .chart-card svg.chart-svg{ display:block; width: 100%; height: 160px; }

  .export-row{ margin-top: 4px; }
  .export-btn{
    appearance:none; width: 100%; border: 1px solid var(--line);
    background: transparent; color: var(--sub); font-weight: 500; font-size: 12.5px;
    padding: 11px; border-radius: var(--radius); cursor:pointer;
  }
  .export-btn:active{ background: var(--hover); }

  .settings-row{ display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
  .settings-row label{ font-size:11.5px; color:var(--sub); font-weight:500; }
  .settings-row input{
    font-size: 13px; color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 10px; outline: none; font-family: inherit; width: 100%;
  }
  .settings-row input::placeholder{ color: var(--sub); }
  .settings-row textarea{
    font-size: 12px; color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 10px; outline: none; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    width: 100%; resize: vertical; line-height: 1.5;
  }
  .settings-row textarea::placeholder{ color: var(--sub); }
  .settings-save-btn{
    appearance:none; width:100%; border:none; cursor:pointer;
    background: var(--active-bg); color: var(--active-fg);
    font-weight:600; font-size:12.5px; padding:10px; border-radius:8px;
  }
  .settings-save-btn:active{ opacity:.85; }
  .settings-secondary-btn{
    appearance:none; width:100%; border:1px solid var(--line); cursor:pointer;
    background: transparent; color: var(--sub);
    font-weight:500; font-size:11.5px; padding:9px; border-radius:8px; margin-top:6px;
  }
  .settings-secondary-btn:active{ background: var(--hover); }
  .sync-status{ font-size:11px; color:var(--sub); margin:10px 2px 0; }
  .sync-status.ok{ color: #4C9F70; }
  .sync-status.error{ color: #E0555C; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
</head>
<body>

<header>
  <p id="today-label">今日の記録</p>
</header>

<main>

  <section id="calendar-section">
    <h2>記録</h2>
    <div class="card">
      <div class="calendar-nav">
        <button id="cal-prev" aria-label="前の月">＜</button>
        <span id="cal-label">-</span>
        <button id="cal-next" aria-label="次の月">＞</button>
      </div>
      <div class="cal-weekdays">
        <span class="cal-weekday">日</span><span class="cal-weekday">月</span><span class="cal-weekday">火</span>
        <span class="cal-weekday">水</span><span class="cal-weekday">木</span><span class="cal-weekday">金</span><span class="cal-weekday">土</span>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
      <p class="cal-hint">●が付いている日は記録があります。日付をタップすると、その日の記録を確認・修正できます。ピンク色が濃いほど、その日に達成できた目標(炭水化物1.5回以下・お酒0回・運動1回以上・歩数8000以上・体重71kg未満)の数が多いことを表します。</p>
    </div>

    <div class="card" id="edit-panel" style="display:none; margin-top:10px;">
      <div class="edit-panel-head">
        <span id="edit-date-label">-</span>
        <button class="edit-close-btn" id="edit-close">閉じる</button>
      </div>

      <div class="counter-grid">
        <div class="counter-item" id="edit-item-carbs">
          <span class="icon-wrap">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 11h16a8 6.2 0 0 1-16 0Z"/><line x1="4" y1="11" x2="20" y2="11"/><line x1="8" y1="4" x2="8" y2="7"/><line x1="12" y1="3" x2="12" y2="7"/><line x1="16" y1="4" x2="16" y2="7"/></svg>
          </span>
          <span class="label">炭水化物</span>
          <div class="count-row">
            <button class="step-btn minus" data-target="edit" data-key="carbs" data-dir="-0.5">－</button>
            <span class="count" id="edit-count-carbs">0</span>
            <button class="step-btn plus" data-target="edit" data-key="carbs" data-dir="0.5">＋</button>
          </div>
        </div>
        <div class="counter-item" id="edit-item-alcohol">
          <span class="icon-wrap">
            <svg class="icon" viewBox="0 0 24 24"><path d="M7 3h10l-2 8a3 3 0 0 1-6 0Z"/><line x1="12" y1="11" x2="12" y2="18"/><line x1="8" y1="21" x2="16" y2="21"/></svg>
          </span>
          <span class="label">お酒</span>
          <div class="count-row">
            <button class="step-btn minus" data-target="edit" data-key="alcohol" data-dir="-1">－</button>
            <span class="count" id="edit-count-alcohol">0</span>
            <button class="step-btn plus" data-target="edit" data-key="alcohol" data-dir="1">＋</button>
          </div>
        </div>
        <div class="counter-item" id="edit-item-exercise">
          <span class="icon-wrap">
            <svg class="icon" viewBox="0 0 24 24"><rect x="1" y="8" width="3" height="8" rx="1"/><rect x="20" y="8" width="3" height="8" rx="1"/><line x1="4" y1="12" x2="20" y2="12"/><rect x="6.5" y="6" width="2" height="12" rx="1"/><rect x="15.5" y="6" width="2" height="12" rx="1"/></svg>
          </span>
          <span class="label">運動</span>
          <div class="count-row">
            <button class="step-btn minus" data-target="edit" data-key="exercise" data-dir="-1">－</button>
            <span class="count" id="edit-count-exercise">0</span>
            <button class="step-btn plus" data-target="edit" data-key="exercise" data-dir="1">＋</button>
          </div>
        </div>
      </div>

      <div class="card numeric-card" id="edit-item-steps">
        <span class="icon-wrap">
          <svg class="icon" viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="4.6" ry="6.2"/><circle cx="8" cy="6" r="1.2"/><circle cx="12" cy="4.3" r="1.2"/><circle cx="16" cy="6" r="1.2"/></svg>
        </span>
        <div class="field">
          <label for="edit-input-steps">歩数</label>
          <input id="edit-input-steps" type="number" inputmode="numeric" placeholder="例: 8000">
        </div>
        <button id="edit-save-steps">保存</button>
      </div>

      <div class="card numeric-card" id="edit-item-weight">
        <span class="icon-wrap">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><rect x="8" y="8.5" width="8" height="3" rx="1"/></svg>
        </span>
        <div class="field">
          <label for="edit-input-weight">体重 (kg)</label>
          <input id="edit-input-weight" type="number" inputmode="decimal" step="0.1" placeholder="例: 65.5">
        </div>
        <button id="edit-save-weight">保存</button>
      </div>
    </div>
  </section>

  <section id="report-section">
    <h2>推移レポート</h2>

    <div class="metric-tabs" id="metric-tabs">
      <button data-metric="carbs" class="active">炭水化物</button>
      <button data-metric="alcohol">お酒</button>
      <button data-metric="exercise">運動</button>
      <button data-metric="steps">歩数</button>
      <button data-metric="weight">体重</button>
    </div>

    <div class="range-tabs" id="range-tabs">
      <button data-range="14" class="active">14日</button>
      <button data-range="30">30日</button>
      <button data-range="90">90日</button>
      <button data-range="180">半年</button>
      <button data-range="365">1年</button>
    </div>

    <div class="card chart-card">
      <div class="chart-head">
        <span class="chart-title" id="chart-title">炭水化物</span>
        <span class="chart-latest" id="chart-latest">-</span>
      </div>
      <svg class="chart-svg" id="chart-main" viewBox="0 0 300 100" preserveAspectRatio="none"></svg>
    </div>

    <div class="export-row">
      <button class="export-btn" id="export-csv">CSVでバックアップを保存</button>
    </div>
  </section>

  <section id="settings-section">
    <h2>設定</h2>
    <div class="card">
      <div class="settings-row">
        <label for="firebase-config-input">Firebase設定(firebaseConfigの中身をそのまま貼り付け)</label>
        <textarea id="firebase-config-input" rows="6" placeholder='{
  apiKey: "...",
  authDomain: "...",
  projectId: "...",
  ...
}'></textarea>
      </div>
      <button class="settings-save-btn" id="firebase-config-save">保存して同期</button>
      <button class="settings-secondary-btn" id="firebase-resync-all">このスマホの全データを再送信</button>
      <button class="settings-secondary-btn" id="cleanup-data">このスマホ内の壊れたデータを掃除</button>
      <p class="sync-status" id="sync-status">未設定(このスマホ内にのみ保存されています)</p>
    </div>
  </section>

</main>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "healthTrackerData_v1";
  var currentRange = 14;
  var currentMetric = "carbs";
  var calYear, calMonth;      // calMonth is 0-indexed
  var selectedDateKey = null;

  var INK = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
  var LINE_COLOR = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
  var GOAL_COLOR = "#B9B9B6";

  var METRIC_META = {
    carbs:    { label: "炭水化物", unit: "回", zeroFill: true,  color: "#4C9F70", goal: 1    },
    alcohol:  { label: "お酒",     unit: "回", zeroFill: true,  color: "#D98E4A", goal: 1    },
    exercise: { label: "運動",     unit: "回", zeroFill: true,  color: "#3B6FE0", goal: 1    },
    steps:    { label: "歩数",     unit: "歩", zeroFill: false, color: "#8B5CF6", goal: 8000 },
    weight:   { label: "体重",     unit: "kg", zeroFill: false, color: "#E0555C", goal: 71, baseline: 60 }
  };

  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function dateKeyOf(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function todayKey(){ return dateKeyOf(new Date()); }

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){
      console.error("読み込みエラー", e);
      return {};
    }
  }
  function saveData(d){ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

  var data = loadData();

  function getRecord(dateKey, createIfMissing){
    if(!data[dateKey]){
      if(!createIfMissing) return null;
      data[dateKey] = { carbs:null, alcohol:null, exercise:null, steps:null, weight:null };
    }
    return data[dateKey];
  }
  function formatDateLabel(){
    var d = new Date();
    var w = ["日","月","火","水","木","金","土"][d.getDay()];
    return (d.getMonth()+1) + "月" + d.getDate() + "日(" + w + ")";
  }
  document.getElementById("today-label").textContent = formatDateLabel();

  // ---- edit panel counters ----
  function refreshEditCounters(){
    if(!selectedDateKey) return;
    var r = getRecord(selectedDateKey, false) || { carbs:null, alcohol:null, exercise:null, steps:null, weight:null };
    ["carbs","alcohol","exercise"].forEach(function(key){
      var v = r[key];
      var isEmpty = (v === null || v === undefined);
      document.getElementById("edit-count-" + key).textContent = isEmpty ? "－" : v;
      document.getElementById("edit-count-" + key).classList.toggle("is-empty", isEmpty);
      var minusBtn = document.querySelector('.step-btn.minus[data-target="edit"][data-key="'+key+'"]');
      if(minusBtn){ minusBtn.disabled = (v === null || v === undefined); }
      document.getElementById("edit-item-" + key).classList.toggle("achieved", isGoalMet(key, v));
    });
    document.getElementById("edit-input-steps").value = (r.steps === null || r.steps === undefined) ? "" : r.steps;
    document.getElementById("edit-input-weight").value = (r.weight === null || r.weight === undefined) ? "" : r.weight;
    document.getElementById("edit-item-steps").classList.toggle("achieved", isGoalMet("steps", r.steps));
    document.getElementById("edit-item-weight").classList.toggle("achieved", isGoalMet("weight", r.weight));
  }

  // ---- +/- handling (edit panel) ----
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".step-btn");
    if(!btn) return;
    var key = btn.getAttribute("data-key");
    var dir = parseFloat(btn.getAttribute("data-dir"));
    var dateKey = selectedDateKey;
    if(!dateKey) return;
    var rec = getRecord(dateKey, true);
    var current = rec[key];

    if(dir < 0 && (current === null || current === undefined)){
      return; // already blank, nothing to subtract (button should be disabled anyway)
    }
    if(dir < 0 && current <= 0){
      // already at 0: one more "－" clears it back to "未記入" rather than staying stuck at 0
      rec[key] = null;
    } else {
      var next = (current || 0) + dir;
      next = Math.round(next * 2) / 2;
      if(next < 0) next = 0;
      rec[key] = next;
    }
    onDataChanged();
    if(navigator.vibrate){ navigator.vibrate(15); }
  });

  // ---- edit panel numeric inputs ----
  document.getElementById("edit-save-steps").addEventListener("click", function(){
    if(!selectedDateKey){ alert("先にカレンダーで日付を選んでください"); return; }
    var raw = document.getElementById("edit-input-steps").value;
    if(raw === ""){
      var rec0 = getRecord(selectedDateKey, false);
      if(rec0) rec0.steps = null;
      onDataChanged();
      return;
    }
    var v = parseFloat(raw);
    if(isNaN(v) || v < 0){ alert("歩数を正しく入力してください"); return; }
    var rec = getRecord(selectedDateKey, true);
    rec.steps = Math.round(v);
    onDataChanged();
  });

  document.getElementById("edit-save-weight").addEventListener("click", function(){
    if(!selectedDateKey){ alert("先にカレンダーで日付を選んでください"); return; }
    var raw = document.getElementById("edit-input-weight").value;
    if(raw === ""){
      var rec0 = getRecord(selectedDateKey, false);
      if(rec0) rec0.weight = null;
      onDataChanged();
      return;
    }
    var v = parseFloat(raw);
    if(isNaN(v) || v <= 0){ alert("体重を正しく入力してください"); return; }
    var rec = getRecord(selectedDateKey, true);
    rec.weight = v;
    onDataChanged();
  });

  // ---- calendar ----
  function initCalendarToCurrentMonth(){
    var d = new Date();
    calYear = d.getFullYear();
    calMonth = d.getMonth();
  }

  var GOAL_CHECKS = {
    carbs: function(v){ return v <= 1.5; },
    alcohol: function(v){ return v === 0; },
    exercise: function(v){ return v >= 1; },
    steps: function(v){ return v >= 8000; },
    weight: function(v){ return v < 71; }
  };
  function isGoalMet(key, value){
    if(typeof value !== "number") return false;
    var check = GOAL_CHECKS[key];
    return check ? check(value) : false;
  }

  function countGoalsMet(rec){
    if(!rec) return 0;
    var n = 0;
    ["carbs","alcohol","exercise","steps","weight"].forEach(function(key){
      if(isGoalMet(key, rec[key])) n++;
    });
    return n;
  }

  function renderCalendar(){
    var grid = document.getElementById("calendar-grid");
    document.getElementById("cal-label").textContent = calYear + "年" + (calMonth + 1) + "月";
    var firstWeekday = new Date(calYear, calMonth, 1).getDay();
    var lastDate = new Date(calYear, calMonth + 1, 0).getDate();
    var todayK = todayKey();
    var html = "";
    for(var i = 0; i < firstWeekday; i++){ html += '<div class="cal-day empty"></div>'; }
    for(var day = 1; day <= lastDate; day++){
      var key = calYear + "-" + pad(calMonth + 1) + "-" + pad(day);
      var hasData = !!data[key];
      var goalsMet = countGoalsMet(data[key]);
      var classes = "cal-day";
      if(goalsMet > 0) classes += " goal-" + goalsMet;
      if(key === todayK) classes += " today";
      if(key === selectedDateKey) classes += " selected";
      html += '<div class="' + classes + '" data-date="' + key + '">' + day + (hasData ? '<span class="dot"></span>' : '') + '</div>';
    }
    grid.innerHTML = html;
    grid.querySelectorAll(".cal-day:not(.empty)").forEach(function(cell){
      cell.addEventListener("click", function(){
        selectDate(cell.getAttribute("data-date"));
      });
    });
  }

  function selectDate(key, opts){
    opts = opts || {};
    selectedDateKey = key;
    var d = new Date(key + "T00:00:00");
    var w = ["日","月","火","水","木","金","土"][d.getDay()];
    document.getElementById("edit-date-label").textContent = (d.getMonth()+1) + "月" + d.getDate() + "日(" + w + ")の記録";
    document.getElementById("edit-panel").style.display = "block";
    refreshEditCounters();
    renderCalendar();
    if(opts.scroll !== false){
      var panel = document.getElementById("edit-panel");
      if(panel.scrollIntoView){ panel.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
    }
  }

  document.getElementById("cal-prev").addEventListener("click", function(){
    calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById("cal-next").addEventListener("click", function(){
    calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalendar();
  });
  document.getElementById("edit-close").addEventListener("click", function(){
    selectedDateKey = null;
    document.getElementById("edit-panel").style.display = "none";
    renderCalendar();
  });

  // ---- metric / range tabs ----
  document.getElementById("metric-tabs").addEventListener("click", function(e){
    var btn = e.target.closest("button"); if(!btn) return;
    document.querySelectorAll("#metric-tabs button").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    currentMetric = btn.getAttribute("data-metric");
    renderChart();
  });
  document.getElementById("range-tabs").addEventListener("click", function(e){
    var btn = e.target.closest("button"); if(!btn) return;
    document.querySelectorAll("#range-tabs button").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    currentRange = parseInt(btn.getAttribute("data-range"), 10);
    renderChart();
  });

  // ---- chart (always line chart, monochrome) ----
  function lastNDates(n){
    var arr = [];
    var d = new Date();
    for(var i = n - 1; i >= 0; i--){
      var dd = new Date(d);
      dd.setDate(d.getDate() - i);
      arr.push(dateKeyOf(dd));
    }
    return arr;
  }

  function renderChart(){
    var meta = METRIC_META[currentMetric];
    document.getElementById("chart-title").textContent = meta.label;

    var dates = lastNDates(currentRange);
    var raw = dates.map(function(k){
      var rec = data[k];
      var v = rec ? rec[currentMetric] : null;
      return (v === null || v === undefined) ? null : v;
    });
    var values = meta.zeroFill ? raw.map(function(v){ return v === null ? 0 : v; }) : raw;

    var svg = document.getElementById("chart-main");
    var present = values.filter(function(v){ return v !== null; });
    if(present.length === 0){
      var emptyHtml = '<line x1="0" y1="' + (100 - 14) + '" x2="300" y2="' + (100 - 14) + '" stroke="' + LINE_COLOR + '" stroke-width="1"></line>';
      if(typeof meta.goal === "number"){
        var emptyMin = meta.zeroFill ? 0 : (typeof meta.baseline === "number" ? meta.baseline : meta.goal * 0.5);
        var emptyMax = meta.zeroFill ? Math.max(meta.goal * 2, 1) : meta.goal * 1.15;
        if(emptyMax <= emptyMin) emptyMax = emptyMin + 1;
        var emptyY = 8 + (100 - 8 - 14) * (1 - (meta.goal - emptyMin) / (emptyMax - emptyMin));
        emptyHtml = goalLineSvg(emptyY, meta) + emptyHtml;
      }
      svg.innerHTML = emptyHtml;
      document.getElementById("chart-latest").textContent = "記録なし";
      return;
    }

    var useLine = currentRange >= 180;
    if(useLine){
      renderLineChart(svg, values, meta, present);
    }else{
      renderBarChart(svg, values, meta, present);
    }

    var latest = null;
    for(var j = values.length - 1; j >= 0; j--){
      if(values[j] !== null){ latest = values[j]; break; }
    }
    document.getElementById("chart-latest").textContent = latest === null ? "記録なし" : "最新: " + latest + meta.unit;
  }

  function goalLineSvg(goalY, meta){
    var y = goalY.toFixed(1);
    var labelY = Math.max(goalY - 3, 7).toFixed(1);
    return '<line x1="0" y1="' + y + '" x2="300" y2="' + y + '" stroke="' + GOAL_COLOR + '" stroke-width="1" stroke-dasharray="4 3"></line>' +
      '<text x="298" y="' + labelY + '" font-size="7" text-anchor="end" fill="' + GOAL_COLOR + '">目標 ' + meta.goal + meta.unit + '</text>';
  }

  function renderLineChart(svg, values, meta, present){
    var min = Math.min.apply(null, present);
    var max = Math.max.apply(null, present);
    if(typeof meta.goal === "number"){
      min = Math.min(min, meta.goal);
      max = Math.max(max, meta.goal);
    }
    if(meta.zeroFill && min > 0) min = 0;
    if(typeof meta.baseline === "number"){ min = Math.min(min, meta.baseline); }
    if(min === max){ min -= 1; max += 1; }

    var W = 300, H = 100, padTop = 8, padBottom = 14;
    var stepX = W / ((values.length - 1) || 1);
    var yOf = function(v){ return padTop + (H - padTop - padBottom) * (1 - (v - min) / (max - min)); };

    var points = [];
    values.forEach(function(v, i){
      if(v === null) return; // no data that day - just skip it, don't break the line
      points.push([i * stepX, yOf(v)]);
    });

    var showAllDots = values.length <= 60;
    var pathHtml = "";
    if(points.length >= 2){
      var d = points.map(function(p, i){ return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
      pathHtml = '<path d="' + d + '" fill="none" stroke="' + meta.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>';
    }

    var dotsHtml = "";
    // a single isolated point (no line to draw) always gets a dot so it's still visible;
    // otherwise dots are only shown on shorter ranges to avoid clutter.
    if(points.length === 1 || showAllDots){
      points.forEach(function(p){
        dotsHtml += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.2" fill="' + meta.color + '"></circle>';
      });
    }

    var goalHtml = (typeof meta.goal === "number") ? goalLineSvg(yOf(meta.goal), meta) : "";

    svg.innerHTML = goalHtml + pathHtml + dotsHtml +
      '<line x1="0" y1="' + (H - padBottom) + '" x2="' + W + '" y2="' + (H - padBottom) + '" stroke="' + LINE_COLOR + '" stroke-width="1"></line>';
  }

  function renderBarChart(svg, values, meta, present){
    var floor = (typeof meta.baseline === "number") ? meta.baseline : 0;
    var min = Math.min(floor, Math.min.apply(null, present));
    var max = Math.max.apply(null, present.concat([typeof meta.goal === "number" ? meta.goal : 0, floor + 1]));
    if(min === max){ max = min + 1; }

    var W = 300, H = 100, padTop = 8, padBottom = 14;
    var innerH = H - padTop - padBottom;
    var barGap = values.length > 45 ? 0.6 : 1.6;
    var slot = W / values.length;
    var barW = Math.max(slot - barGap, 0.6);
    var yOf = function(v){ return padTop + innerH * (1 - (v - min) / (max - min)); };

    var barsHtml = "";
    values.forEach(function(v, i){
      if(v === null) return;
      var x = i * slot + (slot - barW) / 2;
      var y = yOf(v);
      var h = Math.max((H - padBottom) - y, 0.6);
      barsHtml += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="1" fill="' + meta.color + '"></rect>';
    });

    var goalHtml = (typeof meta.goal === "number") ? goalLineSvg(yOf(meta.goal), meta) : "";

    svg.innerHTML = barsHtml + goalHtml +
      '<line x1="0" y1="' + (H - padBottom) + '" x2="' + W + '" y2="' + (H - padBottom) + '" stroke="' + LINE_COLOR + '" stroke-width="1"></line>';
  }

  // ---- CSV export ----
  document.getElementById("export-csv").addEventListener("click", function(){
    var keys = Object.keys(data).sort();
    var rows = ["日付,炭水化物(回),お酒(回),運動(回),歩数,体重(kg)"];
    keys.forEach(function(k){
      var r = data[k];
      rows.push([
        k,
        (r.carbs === null || r.carbs === undefined) ? "" : r.carbs,
        (r.alcohol === null || r.alcohol === undefined) ? "" : r.alcohol,
        (r.exercise === null || r.exercise === undefined) ? "" : r.exercise,
        (r.steps === null || r.steps === undefined) ? "" : r.steps,
        (r.weight === null || r.weight === undefined) ? "" : r.weight
      ].join(","));
    });
    var csv = "\uFEFF" + rows.join("\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "health-tracker-backup_" + todayKey() + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // ---- central refresh after any data mutation ----
  function onDataChanged(){
    saveData(data);
    refreshEditCounters();
    renderCalendar();
    renderChart();
    if(selectedDateKey){ syncOneRecord(selectedDateKey); }
  }

  // ==========================================================
  // ---- Firebase (Firestore) sync (optional; app still works
  //      fully offline/local-only if not configured) ----
  // ==========================================================
  var FIREBASE_CONFIG_KEY = "firebaseConfigJson";
  var PENDING_KEY = "firebasePendingSync";
  var RECORDS_COLLECTION = "records";

  var firebaseApp = null;
  var db = null;

  function getSavedFirebaseConfig(){
    try{ return JSON.parse(localStorage.getItem(FIREBASE_CONFIG_KEY) || "null"); }
    catch(e){ return null; }
  }

  // Firebaseコンソールが表示するコードは正式なJSONではない
  // (キーがクォートで囲まれていない等)ため、多少緩めに読み取る
  function parseFirebaseConfigText_(text){
    var cleaned = text.trim()
      .replace(/^\s*(const|var|let)\s+firebaseConfig\s*=\s*/, "")
      .replace(/;\s*$/, "");
    var obj = new Function("return (" + cleaned + ");")();
    if(!obj || !obj.apiKey || !obj.projectId){
      throw new Error("apiKey / projectId が見つかりません");
    }
    return obj;
  }

  function initFirebase_(config){
    if(!firebaseApp){
      firebaseApp = firebase.initializeApp(config);
      db = firebase.firestore();
    }
    return firebase.auth().signInAnonymously();
  }

  function getPending(){
    try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); }
    catch(e){ return []; }
  }
  function setPending(list){ localStorage.setItem(PENDING_KEY, JSON.stringify(list)); }
  function addPending(key){
    var list = getPending();
    if(list.indexOf(key) === -1){ list.push(key); setPending(list); }
  }
  function removePending(key){
    var list = getPending().filter(function(k){ return k !== key; });
    setPending(list);
  }

  function setSyncStatus(text, cls){
    var el = document.getElementById("sync-status");
    if(!el) return;
    el.textContent = text;
    el.className = "sync-status" + (cls ? " " + cls : "");
  }

  function blankToNull_(v){ return (v === "" || v === undefined) ? null : v; }

  function postRecordToFirestore_(dateKey, rec){
    if(!db) return Promise.reject(new Error("not configured"));
    return db.collection(RECORDS_COLLECTION).doc(dateKey).set({
      carbs: blankToNull_(rec.carbs),
      alcohol: blankToNull_(rec.alcohol),
      exercise: blankToNull_(rec.exercise),
      steps: blankToNull_(rec.steps),
      weight: blankToNull_(rec.weight)
    });
  }

  function syncOneRecord(dateKey){
    if(!db) return;
    var rec = data[dateKey];
    if(!rec) return;
    setSyncStatus("同期中…");
    postRecordToFirestore_(dateKey, rec)
      .then(function(){
        removePending(dateKey);
        setSyncStatus("同期しました", "ok");
      })
      .catch(function(){
        addPending(dateKey);
        setSyncStatus("オフラインのため未同期(このスマホには保存済みです)", "error");
      });
  }

  // 複数件を送るときは必ず1件ずつ順番に送る(挙動をシンプルかつ
  // 予測しやすく保つため。Firestore自体は同時書き込みでも競合しない)
  function sequentialPush_(keys, onProgress, onDone){
    if(!db || keys.length === 0){ onDone(0); return; }
    var i = 0;
    var okCount = 0;
    function next(){
      if(i >= keys.length){ onDone(okCount); return; }
      var key = keys[i++];
      var rec = data[key];
      if(!rec){ next(); return; }
      postRecordToFirestore_(key, rec)
        .then(function(){ okCount++; removePending(key); })
        .catch(function(){ addPending(key); })
        .then(function(){
          onProgress(i, keys.length);
          next();
        });
    }
    next();
  }

  function retryPendingSync(){
    var pending = getPending();
    sequentialPush_(pending, function(){}, function(){});
  }

  function pullAllFromFirestore(){
    if(!db) return Promise.resolve();
    setSyncStatus("同期中…");
    return db.collection(RECORDS_COLLECTION).get()
      .then(function(snapshot){
        var pending = getPending();
        snapshot.forEach(function(doc){
          var key = doc.id;
          if(!VALID_DATE_KEY.test(key)) return;
          if(pending.indexOf(key) !== -1) return; // don't clobber an unsynced local edit
          data[key] = doc.data();
        });
        saveData(data);
        renderCalendar();
        renderChart();
        refreshEditCounters();
        setSyncStatus("同期しました", "ok");
      })
      .catch(function(){
        setSyncStatus("オフラインのため未同期(このスマホ内のデータで表示中)", "error");
      });
  }

  function bulkPushAllLocalData(){
    var keys = Object.keys(data);
    if(keys.length === 0) return;
    setSyncStatus("送信中… (0/" + keys.length + ")");
    sequentialPush_(
      keys,
      function(done, total){ setSyncStatus("送信中… (" + done + "/" + total + ")"); },
      function(okCount){
        if(okCount === keys.length){ setSyncStatus("同期しました", "ok"); }
        else { setSyncStatus("一部同期エラー(次回接続時に自動で再送信します)", "error"); }
      }
    );
  }

  document.getElementById("firebase-config-save").addEventListener("click", function(){
    var textarea = document.getElementById("firebase-config-input");
    var raw = textarea.value.trim();
    if(!raw){
      localStorage.removeItem(FIREBASE_CONFIG_KEY);
      setSyncStatus("未設定(このスマホ内にのみ保存されています)");
      return;
    }
    var config;
    try{
      config = parseFirebaseConfigText_(raw);
    }catch(err){
      alert("Firebase設定の読み取りに失敗しました。Firebaseコンソールに表示された firebaseConfig をそのまま貼り付けてください。");
      return;
    }
    localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(config));
    setSyncStatus("接続中…");
    initFirebase_(config).then(function(){
      // 新しい端末(ローカルにデータが無い)でも、既存の端末でも同じ手順で
      // 正しく揃うように、「まず取り込み」→「そのうえで手元のデータを送信」の順で行う
      pullAllFromFirestore().then(function(){
        bulkPushAllLocalData();
      });
    }).catch(function(){
      setSyncStatus("接続エラー(設定内容を確認してください)", "error");
    });
  });

  document.getElementById("firebase-resync-all").addEventListener("click", function(){
    if(!db){
      alert("先にFirebase設定を保存してください。");
      return;
    }
    if(!confirm("このスマホに保存されている全期間のデータを、Firebaseへ再送信します。よろしいですか?")){
      return;
    }
    bulkPushAllLocalData();
  });

  // "2026-09-07" のような正しい形式以外のキーで保存されてしまったデータを取り除く
  var VALID_DATE_KEY = /^\d{4}-\d{2}-\d{2}$/;
  document.getElementById("cleanup-data").addEventListener("click", function(){
    var badKeys = Object.keys(data).filter(function(k){ return !VALID_DATE_KEY.test(k); });
    if(badKeys.length === 0){
      alert("壊れたデータは見つかりませんでした。");
      return;
    }
    if(!confirm(badKeys.length + "件の、日付の形式がおかしいデータが見つかりました。削除してよろしいですか?(同じ日の正しいデータは残ります)")){
      return;
    }
    badKeys.forEach(function(k){
      delete data[k];
      removePending(k);
    });
    saveData(data);
    renderCalendar();
    renderChart();
    refreshEditCounters();
    alert(badKeys.length + "件削除しました。");
  });

  // ---- init ----
  initCalendarToCurrentMonth();
  renderCalendar();
  selectDate(todayKey(), { scroll: false }); // open today's entry by default
  renderChart();

  var savedFirebaseConfig = getSavedFirebaseConfig();
  if(savedFirebaseConfig){
    document.getElementById("firebase-config-input").value = JSON.stringify(savedFirebaseConfig, null, 2);
    setSyncStatus("接続中…");
    initFirebase_(savedFirebaseConfig).then(function(){
      pullAllFromFirestore().then(function(){ retryPendingSync(); });
    }).catch(function(){
      setSyncStatus("接続エラー(設定内容を確認してください)", "error");
    });
  }

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(err){
        console.warn("Service worker registration failed", err);
      });
    });
  }
})();
</script>
